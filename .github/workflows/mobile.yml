name: mobile android E2E

# Real end-to-end test of mobile-collect.sh (Android path) against a headless,
# KVM-accelerated Android Emulator on GitHub's Linux runners - no physical phone.
# api 33 (google_apis, rootable+realistic) and api 29 (AOSP, exercises the pre-31
# adb-backup path). iOS acquisition is hardware-gated (real iPhone / Corellium);
# the iOS analysis path is covered separately via sample backups.

on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 33
            target: google_apis
          - api: 29
            target: default
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mobile-collect against emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: bash tests/ci/android-smoke.sh

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-api${{ matrix.api }}
          path: ./mobout
          if-no-files-found: warn
