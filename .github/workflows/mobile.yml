name: mobile android E2E

# Real end-to-end test of mobile-collect.sh (Android path) against a headless,
# KVM-accelerated Android Emulator on GitHub's Linux runners - no physical phone.
# api 33 (google_apis, rootable+realistic) and api 29 (AOSP, exercises the pre-31
# adb-backup path). iOS acquisition is hardware-gated (real iPhone / Corellium);
# the iOS analysis path is covered separately via sample backups.

on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 33
            target: google_apis
          - api: 29
            target: default
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mobile-collect against emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -x
            adb root && adb wait-for-device || true
            # seed a little SMS/contacts data so content-provider queries return rows (best-effort)
            adb shell content insert --uri content://sms --bind address:s:+15550000001 \
              --bind body:s:'e2e test message' --bind type:i:1 2>/dev/null || true
            chmod +x mobile/mobile-collect.sh
            # --auto skips the interactive doctrine gate; --scenario injects intake
            ./mobile/mobile-collect.sh --android --auto --scenario beacon \
              -c CIMOB -d ./mobout || echo "collector exit=$? (asserting artifacts next)"
            echo "=== assert sealed mobile bundle ==="
            base=$(find ./mobout -maxdepth 1 -type d -name 'CIMOB_*' | head -1)
            echo "bundle: $base"
            test -n "$base"
            test -f "$base/meta/collection_info.json"
            test -f "$base/logs/run_state.json"
            test -f "$base/SUMMARY.md"
            echo "--- scenario + acquisition tier ---"
            grep -o '"scenario":"[^"]*"'         "$base/meta/collection_info.json"
            grep -o '"acquisition_tier":"[^"]*"' "$base/meta/collection_info.json"
            echo "--- run_state verdict ---"
            grep -o '"verdict":"[^"]*"' "$base/logs/run_state.json"
            grep -q '"scenario":"beacon"' "$base/meta/collection_info.json"
            # ledger produced valid JSONL events
            test -s "$base/logs/run_state.jsonl"
            echo "captured artifacts:"; ls "$base/dumpsys" "$base/artifacts" 2>/dev/null | head

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-api${{ matrix.api }}
          path: ./mobout
          if-no-files-found: warn
